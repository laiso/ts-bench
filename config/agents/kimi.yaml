name: kimi
description: "Moonshot Kimi CLI agent"
defaultProvider: moonshot
install:
  method: uv_tool
  package: kimi-cli
  python: "3.13"
  bin: kimi

providers:
  moonshot:
    require:
      - KIMI_API_KEY
    env:
      KIMI_API_KEY: "${KIMI_API_KEY}"

# {kimiConfig} is generated by the loader: it registers the moonshot provider
# (honoring KIMI_BASE_URL) and the selected model with its context size.
command:
  - kimi
  - --print
  - --output-format
  - text
  - --config
  - "{kimiConfig}"
  - "{#model}--model {model}{/model}"
  - -p
  - "{instructions}"
