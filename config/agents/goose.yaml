name: goose
description: "Block Goose AI agent"
defaultProvider: anthropic
install:
  method: curl
  url: "https://github.com/block/goose/releases/download/stable/download_cli.sh"
  cmdPrefix: "CONFIGURE=false"
  bin: goose

env:
  GOOSE_MODEL: "{model}"
  GOOSE_PROVIDER: "{provider}"
  GOOSE_DISABLE_KEYRING: "1"

providers:
  anthropic:
    require:
      - [ANTHROPIC_API_KEY, DASHSCOPE_API_KEY]
    env:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-${DASHSCOPE_API_KEY}}"
  openai:
    require:
      - OPENAI_API_KEY
    env:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
  google:
    require:
      - [GOOGLE_API_KEY, GEMINI_API_KEY]
    env:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-${GEMINI_API_KEY}}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-${GOOGLE_API_KEY}}"
  dashscope:
    require:
      - DASHSCOPE_API_KEY
    env:
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY}"
  deepseek:
    require:
      - DEEPSEEK_API_KEY
    env:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
  xai:
    require:
      - XAI_API_KEY
    env:
      XAI_API_KEY: "${XAI_API_KEY}"
  openrouter:
    require:
      - OPENROUTER_API_KEY
    env:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"

command:
  - goose
  - run
  - --with-builtin
  - developer
  - --text
  - "{instructions}"
